name: Build

# Day mot tag dang v1.2.3, hoac bam tay trong tab Actions.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        team: [S1, S2, S3, S4]
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      # Khoa service account KHONG nam trong repo. Moi team mot Secret rieng:
      # SA_S1 ... SA_S4, noi dung la ca file JSON cua service account do.
      - name: Ghi khoa service account
        shell: bash
        env:
          SA: ${{ secrets[format('SA_{0}', matrix.team)] }}
        run: |
          if [ -z "$SA" ]; then
            echo "Thieu secret SA_${{ matrix.team }}"; exit 1
          fi
          printf '%s' "$SA" > "teams/${{ matrix.team }}/service-account.json"

      - name: Build
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "macOS" ]; then
            node build-team.js ${{ matrix.team }} --mac
          else
            node build-team.js ${{ matrix.team }} --win
          fi

      - name: Xoa khoa khoi may build
        if: always()
        shell: bash
        run: rm -f "teams/${{ matrix.team }}/service-account.json"

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.dmg
            dist/*.exe
          fail_on_unmatched_files: false
